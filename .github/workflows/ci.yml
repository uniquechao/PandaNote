name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  manager:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r apps/manager/requirements.lock -r apps/manager/requirements-caldav.lock
      - run: mkdir -p apps/manager/build
      - run: python -m pytest apps/manager/tests --basetemp=apps/manager/build/pytest -q
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/manager/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '25.8.2'
          cache: npm
          cache-dependency-path: apps/manager/frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
      - run: git diff --exit-code -- ../manager/static
  device-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: mkdir -p apps/reader-shell/build
      - run: python -m unittest test_standbypolicy test_startup_retry test_timeanchor test_standby_runtime test_suspendrequest test_battery test_einkrefresh test_powerkeys_boundary test_local_apps_tool -v
        working-directory: apps/reader-shell/tests
