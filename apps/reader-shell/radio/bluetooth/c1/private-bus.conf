<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN" "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <type>system</type>
  <listen>unix:path=/tmp/pandanote-connectivity/bluetooth/run/bus</listen>
  <auth>EXTERNAL</auth>
  <!-- No includes, servicedirs, activation helper, public bus or PID file. -->
  <policy context="default">
    <deny own="*"/>
    <deny send_destination="*"/>
    <deny eavesdrop="true"/>
  </policy>
  <policy user="root">
    <allow own="*"/>
    <allow send_destination="*"/>
    <allow receive_sender="*"/>
  </policy>
  <limit name="auth_timeout">3000</limit>
  <limit name="max_incoming_bytes">65536</limit>
  <limit name="max_outgoing_bytes">65536</limit>
  <limit name="max_message_size">65536</limit>
  <limit name="max_completed_connections">16</limit>
</busconfig>
